services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://rootine_user:supersecret@db:5432/rootine_db?schema=public
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=rootine_user
      - POSTGRES_PASSWORD=supersecret
      - POSTGRES_DB=rootine_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootine_user -d rootine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: